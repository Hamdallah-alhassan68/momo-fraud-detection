services:
  - type: web
    name: momo-fraud-detection-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: momo-sentinel-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: MOMO_DATABASE_PATH
        value: /var/data/fraud.db
      - key: MOMO_AUTH_SECRET
        generateValue: true
      - key: MOMO_AUDIT_HMAC_KEY
        generateValue: true
      - key: MOMO_ADMIN_TOKEN
        sync: false
      - key: MOMO_ENABLE_DEMO_ADMIN_USERS
        value: "false"
      - key: MOMO_SIMULATION_ONLY
        value: "true"
      - key: MTN_DISBURSEMENT_ENVIRONMENT
        value: sandbox
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: AFRICASTALKING_ENVIRONMENT
        value: sandbox
      - key: AFRICASTALKING_USERNAME
        sync: false
      - key: AFRICASTALKING_API_KEY
        sync: false
      - key: AFRICASTALKING_SENDER_ID
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
